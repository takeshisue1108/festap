<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>festap Festa harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #121212; }
      #app { position: relative; isolation: isolate; width: 100vw; height: 100vh; overflow: hidden; }
      #festa { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
      #control {
        position: absolute; left: 40%; top: 60%; width: 30%; height: 12%;
        background: transparent; border: 4px solid #f2f0ef; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="festa" aria-hidden="true"></canvas>
      <button id="control" aria-label="control under test"></button>
    </div>
    <script type="module" src="./festa.ts"></script>
  </body>
</html>
